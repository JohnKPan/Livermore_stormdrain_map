# The environment. There is only this one.
#
# It used to be the second of two: a uv venv (.venv/, requirements.txt) was
# primary, and this existed solely to add GDAL for one job -- mosaicking lidar
# collects that sit in DIFFERENT projections. A VRT cannot reproject, rasterio
# ships no multi-source warp, so that needs GDAL's own gdal.Warp, and GDAL has
# no Windows wheels on PyPI at any version.
#
# Keeping both was a liability rather than a fallback. This env is a strict
# SUPERSET -- it has every package the venv had, plus osgeo -- so the venv could
# do nothing this cannot, while two interpreters on one Windows box (three, with
# the system python, four with WSL's) turned "which python am I running?" into
# the most common failure in the project. A GDAL_DATA error that took a long
# session to trace was ultimately an interpreter question, not a GDAL one.
#
# The point of using conda-forge for BOTH gdal and rasterio is that they then
# link the SAME libgdal. Installing the `gdal` bindings alongside a wheel-built
# rasterio would put two independent GDALs in one process, each with its own
# driver registry and PROJ data path -- a well-known way to break CRS handling
# on Windows, and this project leans on compound CRS with a NAVD88 vertical
# datum.
#
# Create it (micromamba.exe is fetched into .conda/ by the readme's recipe):
#
#     .conda/micromamba.exe create -y -p .conda/env -f environment.yml
#     .conda/micromamba.exe run -p .conda/env python add_elevation.py
#
# run_pipeline.sh (and run_pipeline.py) pick this env up automatically when
# .conda/env exists, and fail loudly when it does not -- there is no fallback to
# whatever `python` happens to be on PATH, because that is exactly how the wrong
# interpreter used to get selected in silence.

name: stormdrain
channels:
  - conda-forge
dependencies:
  - python=3.12
  # The reason this file exists.
  - gdal>=3.9
  - libgdal-core>=3.9
  # Same libgdal as gdal, above.
  - rasterio>=1.4
  - pyproj>=3.7
  # Everything the scripts import. Checked against a scan of every `import`
  # in *.py: bokeh contextily geopandas matplotlib numpy osgeo pandas plotly
  # pyarrow pyproj rasterio shapely xyzservices -- all present below.
  - pandas>=2.2
  - pyarrow>=17
  - numpy>=2.0
  - matplotlib>=3.10
  - contextily>=1.6
  - bokeh>=3.9
  - xyzservices>=2024.9
  - plotly>=6.0
  - shapely>=2.0
  # Same reason as rasterio: conda-forge so pyogrio links the one libgdal.
  - geopandas>=1.0
